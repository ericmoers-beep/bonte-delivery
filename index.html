// ─── STORAGE (localStorage for PWA) ───
const STORAGE_KEY = "bonte-delivery-data";

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

function saveData(data) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) { console.error("Save failed:", e); }
}

// ─── MAIN APP ───
function BonteDelivery() {
  const [screen, setScreen] = useState("home");
  const [routes, setRoutes] = useState(DEFAULT_ROUTES);
  const [activeRouteId, setActiveRouteId] = useState(null);
  const [dayData, setDayData] = useState(null);
  const [viewMode, setViewMode] = useState("delivery");
  const [expandedStop, setExpandedStop] = useState(null);
  const [standardOps, setStandardOps] = useState(DEFAULT_OPS);
  const [customStops, setCustomStops] = useState({});
  const [showCodes, setShowCodes] = useState(false);
  const [showAddProduct, setShowAddProduct] = useState(null);
  const [showAddReturn, setShowAddReturn] = useState(null);
  const [showAddStop, setShowAddStop] = useState(false);
  const [showAddOp, setShowAddOp] = useState(false);
  const [newOpText, setNewOpText] = useState("");
  const [loaded, setLoaded] = useState(false);
  const [csvCopied, setCsvCopied] = useState(false);
  const [txtCopied, setTxtCopied] = useState(false);

  // Load saved data
  useEffect(() => {
    const saved = loadData();
    if (saved) {
      if (saved.routes) setRoutes(saved.routes);
      if (saved.standardOps) setStandardOps(saved.standardOps);
      if (saved.customStops) setCustomStops(saved.customStops);
      if (saved.dayData) setDayData(saved.dayData);
      if (saved.activeRouteId) setActiveRouteId(saved.activeRouteId);
    }
    setLoaded(true);
  }, []);

  // Auto-save
  useEffect(() => {
    if (!loaded) return;
    const t = setTimeout(() => {
      saveData({ routes, standardOps, customStops, dayData, activeRouteId });
    }, 500);
    return () => clearTimeout(t);
  }, [routes, standardOps, customStops, dayData, activeRouteId, loaded]);

  const allStops = { ...MASTER_STOPS, ...customStops };

  function startDay(routeId) {
    const route = routes.find(r => r.id === routeId);
    if (!route) return;
    setActiveRouteId(routeId);
    const stops = route.stopIds.map((sid, i) => {
      const master = allStops[sid];
      // Start every stop with all products at qty 0
      const products = ALL_PRODUCTS.map((p, j) => ({
        name: p.name, rate: p.rate, qty: 0, id: `${sid}-${j}`, originalQty: 0, delivered: false
      }));
      return {
        stopId: sid, order: i + 1, products,
        pizzaCount: "", returns: [], dailyNotes: "",
        delivered: false,
      };
    });
    setDayData({ date: new Date().toLocaleDateString(), stops });
    setScreen("route");
  }

  function updateStop(stopId, updates) {
    setDayData(prev => ({
      ...prev,
      stops: prev.stops.map(s => s.stopId === stopId ? { ...s, ...updates } : s)
    }));
  }

  function updateProduct(stopId, productIdx, updates) {
    setDayData(prev => ({
      ...prev,
      stops: prev.stops.map(s => {
        if (s.stopId !== stopId) return s;
        const products = s.products.map((p, i) => i === productIdx ? { ...p, ...updates } : p);
        return { ...s, products };
      })
    }));
  }

  function addProduct(stopId, product) {
    setDayData(prev => ({
      ...prev,
      stops: prev.stops.map(s => {
        if (s.stopId !== stopId) return s;
        return { ...s, products: [...s.products, { ...product, id: `${stopId}-${s.products.length}`, originalQty: product.qty, delivered: false }] };
      })
    }));
  }

  function removeProduct(stopId, productIdx) {
    setDayData(prev => ({
      ...prev,
      stops: prev.stops.map(s => {
        if (s.stopId !== stopId) return s;
        return { ...s, products: s.products.filter((_, i) => i !== productIdx) };
      })
    }));
  }

  function addReturn(stopId, ret) {
    setDayData(prev => ({
      ...prev,
      stops: prev.stops.map(s => {
        if (s.stopId !== stopId) return s;
        return { ...s, returns: [...s.returns, { ...ret, id: Date.now() }] };
      })
    }));
  }

  function removeReturn(stopId, retId) {
    setDayData(prev => ({
      ...prev,
      stops: prev.stops.map(s => {
        if (s.stopId !== stopId) return s;
        return { ...s, returns: s.returns.filter(r => r.id !== retId) };
      })
    }));
  }

  function moveStop(fromIdx, dir) {
    const toIdx = fromIdx + dir;
    setDayData(prev => {
      const stops = [...prev.stops];
      if (toIdx < 0 || toIdx >= stops.length) return prev;
      [stops[fromIdx], stops[toIdx]] = [stops[toIdx], stops[fromIdx]];
      return { ...prev, stops: stops.map((s, i) => ({ ...s, order: i + 1 })) };
    });
  }

  function generateSummary() {
    if (!dayData) return "";
    let s = `BONTÉ DELIVERY SUMMARY\n${dayData.date}\n${"─".repeat(30)}\n\n`;
    dayData.stops.forEach(stop => {
      const info = allStops[stop.stopId] || {};
      s += `■ ${info.name || stop.stopId}\n`;
      if (stop.products.length > 0) {
        const adjusted = stop.products.filter(p => p.originalQty > 0 && p.qty !== p.originalQty);
        const total = stop.products.reduce((sum, p) => sum + (p.qty * p.rate), 0);
        stop.products.forEach(p => {
          let line = `  ${p.name}: ${p.qty} × $${p.rate.toFixed(2)} = $${(p.qty * p.rate).toFixed(2)}`;
          if (p.originalQty > 0 && p.qty !== p.originalQty) line += ` ⚠️ (was ${p.originalQty})`;
          s += line + "\n";
        });
        s += `  TOTAL: $${total.toFixed(2)}`;
        if (adjusted.length > 0) s += ` (${adjusted.length} adjustment${adjusted.length > 1 ? "s" : ""})`;
        s += "\n";
      }
      if (stop.pizzaCount !== "" && stop.pizzaCount !== null) s += `  🍕 Pizza count: ${stop.pizzaCount}\n`;
      if (stop.returns.length > 0) {
        s += `  ↩️ Returns:\n`;
        stop.returns.forEach(r => { s += `    ${r.qty} × ${r.product}\n`; });
      }
      if (stop.dailyNotes) s += `  📝 ${stop.dailyNotes}\n`;
      s += `  ${stop.delivered ? "✅ Delivered" : "⬜ Not delivered"}\n\n`;
    });
    const opsChecked = standardOps.filter(o => o.checked).length;
    s += `OPS: ${opsChecked}/${standardOps.length} complete\n`;
    standardOps.forEach(o => { s += `  ${o.checked ? "✅" : "⬜"} ${o.text}\n`; });
    return s;
  }

  function generateCSV() {
    if (!dayData) return "";
    const rows = [];
    rows.push(["BONTÉ DELIVERY REPORT", "", "", "", "", "", ""].join(","));
    rows.push(["Date:", dayData.date, "", "", "", "", ""].join(","));
    rows.push([]);
    
    dayData.stops.forEach(stop => {
      const info = allStops[stop.stopId] || {};
      const total = stop.products.reduce((s, p) => s + (p.qty * p.rate), 0);
      
      // Stop header
      rows.push(["═══════════════════════════", "", "", "", "", "", ""].join(","));
      rows.push([`"▸ ${info.name || stop.stopId}"`, "", "", "", "", "", stop.delivered ? "✓ DELIVERED" : "PENDING"].join(","));
      if (stop.dailyNotes) rows.push([`"  Notes: ${stop.dailyNotes.replace(/"/g, '""')}"`, "", "", "", "", "", ""].join(","));
      rows.push([]);
      
      // Products
      if (stop.products.filter(p => p.qty > 0).length > 0) {
        rows.push(["  Product","Ordered","Delivered","Adjusted","Unit Price","Line Total",""].join(","));
        stop.products.forEach(p => {
          if (p.qty > 0 || (p.originalQty > 0 && p.qty !== p.originalQty)) {
            const adj = p.originalQty > 0 && p.qty !== p.originalQty ? `"YES (was ${p.originalQty})"` : "";
            rows.push([
              `"  ${p.name}"`, p.originalQty, p.qty, adj,
              `$${p.rate.toFixed(2)}`, `$${(p.qty * p.rate).toFixed(2)}`, ""
            ].join(","));
          }
        });
        rows.push(["","","","",`"▸ STOP TOTAL:"`, `$${total.toFixed(2)}`, ""].join(","));
      }
      
      // Pizza count
      if (info.checkPizza) {
        rows.push([`"  🍕 Pizza crust count: ${stop.pizzaCount || 'Not counted'}"`, "", "", "", "", "", ""].join(","));
      }
      
      // Returns
      if (stop.returns.length > 0) {
        rows.push([`"  ↩ RETURNS:"`, "", "", "", "", "", ""].join(","));
        stop.returns.forEach(r => {
          rows.push([`"    ${r.qty} × ${r.product}"`, "", "", "", "", "", ""].join(","));
        });
      }
      
      rows.push([]);
    });
    
    // Grand totals
    const grandTotal = dayData.stops.reduce((sum, stop) => sum + stop.products.reduce((s, p) => s + (p.qty * p.rate), 0), 0);
    const totalReturns = dayData.stops.reduce((sum, stop) => sum + stop.returns.length, 0);
    rows.push(["═══════════════════════════", "", "", "", "", "", ""].join(","));
    rows.push([`"GRAND TOTAL"`, "", "", "", "", `$${grandTotal.toFixed(2)}`, ""].join(","));
    rows.push([`"Total stops: ${dayData.stops.length}"`, "", `"Delivered: ${dayData.stops.filter(s => s.delivered).length}"`, "", `"Returns: ${totalReturns}"`, "", ""].join(","));
    
    return rows.join("\n");
  }

  async function downloadXLSX() {
    try {
      const wb = new ExcelJS.Workbook();
      const ws = wb.addWorksheet('Delivery Report', { properties: { tabColor: { argb: 'FFD4915C' } } });

      ws.columns = [
        { width: 30 }, { width: 14 }, { width: 14 }, { width: 16 }, { width: 18 }
      ];

      const stopFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFD4915C' } };
      const headerFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF0E6D6' } };

      // Title
      ws.mergeCells('A1:E1');
      const titleCell = ws.getCell('A1');
      titleCell.value = 'BONTÉ DELIVERY REPORT';
      titleCell.font = { name: 'Arial', size: 18, bold: true, color: { argb: 'FFD4915C' } };
      ws.getRow(1).height = 28;

      ws.getCell('A2').value = `Date: ${dayData.date}`;
      ws.getCell('A2').font = { name: 'Arial', size: 12, color: { argb: 'FF666666' } };
      const routeName = routes.find(rt => rt.id === activeRouteId)?.name || '';
      ws.getCell('C2').value = `Route: ${routeName}`;
      ws.getCell('C2').font = { name: 'Arial', size: 12, color: { argb: 'FF666666' } };

      let r = 4;
      const totalCells = [];

      dayData.stops.forEach(stop => {
        const info = allStops[stop.stopId] || {};
        const total = stop.products.reduce((s, p) => s + (p.qty * p.rate), 0);

        // Stop name header
        ws.mergeCells(`A${r}:D${r}`);
        const nameCell = ws.getCell(`A${r}`);
        nameCell.value = info.name || stop.stopId;
        nameCell.font = { name: 'Arial', size: 15, bold: true, color: { argb: 'FF1A1612' } };
        nameCell.fill = stopFill;
        nameCell.alignment = { vertical: 'middle' };
        for (let c = 1; c <= 5; c++) ws.getCell(r, c).fill = stopFill;
        ws.getCell(`E${r}`).value = stop.delivered ? '✓ DELIVERED' : 'PENDING';
        ws.getCell(`E${r}`).font = { name: 'Arial', size: 11, bold: true, color: { argb: 'FF1A1612' } };
        ws.getCell(`E${r}`).alignment = { horizontal: 'right', vertical: 'middle' };
        ws.getRow(r).height = 28;
        r++;

        // Product headers
        const headers = ['Product', 'Qty', 'Unit Price', 'Line Total'];
        headers.forEach((h, i) => {
          const cell = ws.getCell(r, i + 1);
          cell.value = h;
          cell.font = { name: 'Arial', size: 11, bold: true, underline: true, color: { argb: 'FF666666' } };
          cell.fill = headerFill;
        });
        r++;

        // Products (only show ones with qty > 0 or adjusted)
        const firstRow = r;
        stop.products.forEach(p => {
          if (p.qty > 0 || (p.originalQty > 0 && p.qty !== p.originalQty)) {
            ws.getCell(r, 1).value = '  ' + p.name;
            ws.getCell(r, 1).font = { name: 'Arial', size: 11 };
            ws.getCell(r, 2).value = p.qty;
            ws.getCell(r, 2).alignment = { horizontal: 'right' };
            ws.getCell(r, 3).value = p.rate;
            ws.getCell(r, 3).numFmt = '$#,##0.00';
            ws.getCell(r, 3).alignment = { horizontal: 'right' };
            ws.getCell(r, 4).value = p.qty * p.rate;
            ws.getCell(r, 4).numFmt = '$#,##0.00';
            ws.getCell(r, 4).alignment = { horizontal: 'right' };
            if (p.originalQty > 0 && p.qty !== p.originalQty) {
              ws.getCell(r, 5).value = '⚠️ was ' + p.originalQty;
              ws.getCell(r, 5).font = { name: 'Arial', size: 11, color: { argb: 'FFC45C5C' } };
            }
            r++;
          }
        });

        // Stop total
        ws.getCell(r, 3).value = 'STOP TOTAL:';
        ws.getCell(r, 3).font = { name: 'Arial', size: 12, bold: true, color: { argb: 'FFD4915C' } };
        ws.getCell(r, 3).alignment = { horizontal: 'right' };
        ws.getCell(r, 4).value = total;
        ws.getCell(r, 4).numFmt = '$#,##0.00';
        ws.getCell(r, 4).font = { name: 'Arial', size: 14, bold: true, color: { argb: 'FFD4915C' } };
        ws.getCell(r, 4).alignment = { horizontal: 'right' };
        totalCells.push(`D${r}`);
        r++;

        // Pizza count
        if (info.checkPizza) {
          ws.getCell(r, 1).value = '🍕 Pizza crust count:';
          ws.getCell(r, 1).font = { name: 'Arial', size: 11, color: { argb: 'FF666666' } };
          const pVal = stop.pizzaCount !== '' && stop.pizzaCount !== null ? (isNaN(stop.pizzaCount) ? stop.pizzaCount : Number(stop.pizzaCount)) : 'Not counted';
          ws.getCell(r, 2).value = pVal;
          ws.getCell(r, 2).font = { name: 'Arial', size: 13, bold: true };
          ws.getCell(r, 2).alignment = { horizontal: 'right' };
          r++;
        }

        // Returns
        if (stop.returns.length > 0) {
          ws.getCell(r, 1).value = '↩ Returns:';
          ws.getCell(r, 1).font = { name: 'Arial', size: 11, color: { argb: 'FFC45C5C' } };
          r++;
          stop.returns.forEach(ret => {
            ws.getCell(r, 1).value = '    ' + ret.qty + ' × ' + ret.product;
            ws.getCell(r, 1).font = { name: 'Arial', size: 11, color: { argb: 'FFC45C5C' } };
            r++;
          });
        }

        // Notes
        if (stop.dailyNotes) {
          ws.getCell(r, 1).value = 'Notes:';
          ws.getCell(r, 1).font = { name: 'Arial', size: 11, bold: true, color: { argb: 'FF666666' } };
          r++;
          ws.mergeCells(`A${r}:E${r}`);
          ws.getCell(r, 1).value = stop.dailyNotes;
          ws.getCell(r, 1).font = { name: 'Arial', size: 11, italic: true, color: { argb: 'FF666666' } };
          ws.getCell(r, 1).alignment = { wrapText: true, vertical: 'top' };
          ws.getRow(r).height = Math.max(28, stop.dailyNotes.length / 3);
          r++;
        }

        r++; // spacing
      });

      // Grand total
      r++;
      ws.mergeCells(`A${r}:C${r}`);
      ws.getCell(r, 1).value = 'GRAND TOTAL';
      ws.getCell(r, 1).font = { name: 'Arial', size: 16, bold: true, color: { argb: 'FFD4915C' } };
      const grandTotal = dayData.stops.reduce((sum, s) => sum + s.products.reduce((ps, p) => ps + (p.qty * p.rate), 0), 0);
      ws.getCell(r, 4).value = grandTotal;
      ws.getCell(r, 4).numFmt = '$#,##0.00';
      ws.getCell(r, 4).font = { name: 'Arial', size: 18, bold: true, color: { argb: 'FFD4915C' } };
      ws.getCell(r, 4).alignment = { horizontal: 'right' };
      r++;

      const deliveredCount = dayData.stops.filter(s => s.delivered).length;
      const totalReturns = dayData.stops.reduce((sum, s) => sum + s.returns.length, 0);
      ws.getCell(r, 1).value = `Total stops: ${dayData.stops.length}`;
      ws.getCell(r, 1).font = { name: 'Arial', size: 11, color: { argb: 'FF666666' } };
      ws.getCell(r, 2).value = `Delivered: ${deliveredCount}`;
      ws.getCell(r, 2).font = { name: 'Arial', size: 11, color: { argb: 'FF666666' } };
      ws.getCell(r, 3).value = `Returns: ${totalReturns}`;
      ws.getCell(r, 3).font = { name: 'Arial', size: 11, color: { argb: 'FF666666' } };

      const buffer = await wb.xlsx.writeBuffer();
      const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const filename = `bonte-${dayData.date.replace(/\//g, "-")}.xlsx`;

      if (navigator.share && navigator.canShare) {
        const file = new File([blob], filename, { type: blob.type });
        if (navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: 'Bonté Delivery Report' }).catch(() => {});
          setCsvCopied(true); setTimeout(() => setCsvCopied(false), 2000);
          return;
        }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);
      setCsvCopied(true); setTimeout(() => setCsvCopied(false), 2000);
    } catch(e) {
      console.error('XLSX export failed:', e);
      // Fall back to CSV copy
      const csv = generateCSV();
      navigator.clipboard?.writeText(csv);
      setCsvCopied(true); setTimeout(() => setCsvCopied(false), 2000);
    }
  }

  function fallbackCopy(text) {
    navigator.clipboard?.writeText(text);
    setCsvCopied(true);
    setTimeout(() => setCsvCopied(false), 2000);
  }

  // ─── STYLES ───
  const colors = {
    bg: "#1A1612", surface: "#252019", surfaceLight: "#302A23",
    border: "#3D352C", primary: "#D4915C", primaryDim: "#A06A3C",
    success: "#5B8A5B", successDim: "#3D6B3D",
    danger: "#C45C5C", dangerDim: "#8B3E3E",
    text: "#E8DDD0", textDim: "#9B8E80", textMuted: "#6B5F53",
    accent: "#7BA7C2",
  };

  const baseBtn = {
    border: "none", borderRadius: 10, cursor: "pointer",
    fontFamily: "'DM Sans', sans-serif", fontWeight: 600,
    transition: "all 0.15s ease", minHeight: 44,
  };

  if (!loaded) return (
    <div style={{ background: colors.bg, color: colors.text, height: "100vh", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'DM Sans', sans-serif" }}>
      <p style={{ opacity: 0.6 }}>Loading...</p>
    </div>
  );

  // ─── HOME SCREEN ───
  if (screen === "home") return (
    <div style={{ background: colors.bg, minHeight: "100vh", color: colors.text, fontFamily: "'DM Sans', sans-serif", padding: "0 0 100px 0" }}>
      <div style={{ padding: "28px 20px 20px", borderBottom: `1px solid ${colors.border}` }}>
        <h1 style={{ fontFamily: "'DM Serif Display', serif", fontSize: 30, margin: 0, color: colors.primary }}>Bonté Delivery</h1>
        <p style={{ color: colors.textDim, fontSize: 15, margin: "6px 0 0" }}>Select a route to start your day</p>
      </div>

      <div style={{ padding: "16px 20px" }}>
        <h2 style={{ fontSize: 14, color: colors.textDim, textTransform: "uppercase", letterSpacing: 1, margin: "0 0 12px" }}>Routes</h2>
        {routes.map(route => (
          <div key={route.id} style={{ background: colors.surface, borderRadius: 14, padding: "20px", marginBottom: 12, border: `1px solid ${colors.border}` }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div>
                <div style={{ fontWeight: 600, fontSize: 19 }}>{route.name}</div>
                <div style={{ color: colors.textDim, fontSize: 14, marginTop: 4 }}>{route.stopIds.length} stops</div>
              </div>
              <button onClick={() => startDay(route.id)} style={{ ...baseBtn, background: colors.primary, color: "#1A1612", padding: "12px 24px", fontSize: 16 }}>
                Start
              </button>
            </div>
            <div style={{ marginTop: 10, display: "flex", flexWrap: "wrap", gap: 6 }}>
              {route.stopIds.map(sid => (
                <span key={sid} style={{ background: colors.surfaceLight, color: colors.textDim, fontSize: 12, padding: "4px 10px", borderRadius: 6 }}>
                  {allStops[sid]?.shortName || sid}
                </span>
              ))}
            </div>
          </div>
        ))}
      </div>

      {dayData && (
        <div style={{ padding: "0 20px 16px" }}>
          <button onClick={() => setScreen("route")} style={{ ...baseBtn, background: colors.successDim, color: colors.text, padding: "14px", width: "100%", fontSize: 15, border: `1px solid ${colors.success}` }}>
            ↩ Resume Today's Run ({dayData.date})
          </button>
        </div>
      )}

      <div style={{ padding: "0 20px" }}>
        <h2 style={{ fontSize: 14, color: colors.textDim, textTransform: "uppercase", letterSpacing: 1, margin: "16px 0 12px" }}>Standard Ops</h2>
        {standardOps.map((op, i) => (
          <div key={op.id} onClick={() => {
            setStandardOps(prev => prev.map((o, j) => j === i ? { ...o, checked: !o.checked } : o));
          }} style={{ background: colors.surface, borderRadius: 12, padding: "16px 18px", marginBottom: 8, display: "flex", alignItems: "center", gap: 14, cursor: "pointer", border: `1px solid ${op.checked ? colors.success : colors.border}` }}>
            <span style={{ fontSize: 22 }}>{op.checked ? "✅" : "⬜"}</span>
            <span style={{ fontSize: 15, color: op.checked ? colors.textDim : colors.text, textDecoration: op.checked ? "line-through" : "none" }}>{op.text}</span>
          </div>
        ))}
        {showAddOp ? (
          <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
            <input value={newOpText} onChange={e => setNewOpText(e.target.value)} placeholder="New ops item..."
              style={{ flex: 1, background: colors.surfaceLight, border: `1px solid ${colors.border}`, borderRadius: 8, padding: "10px 12px", color: colors.text, fontSize: 14 }} />
            <button onClick={() => {
              if (newOpText.trim()) {
                setStandardOps(prev => [...prev, { id: `op-${Date.now()}`, text: newOpText.trim(), checked: false }]);
                setNewOpText(""); setShowAddOp(false);
              }
            }} style={{ ...baseBtn, background: colors.primary, color: "#1A1612", padding: "10px 14px", fontSize: 13 }}>Add</button>
            <button onClick={() => { setShowAddOp(false); setNewOpText(""); }} style={{ ...baseBtn, background: colors.surfaceLight, color: colors.textDim, padding: "10px 14px", fontSize: 13 }}>✕</button>
          </div>
        ) : (
          <button onClick={() => setShowAddOp(true)} style={{ ...baseBtn, background: "transparent", color: colors.textMuted, padding: "10px 0", fontSize: 13, border: "none" }}>+ Add ops item</button>
        )}
      </div>

      <div style={{ padding: "16px 20px" }}>
        <button onClick={() => setShowCodes(!showCodes)} style={{ ...baseBtn, background: colors.surface, color: colors.textDim, padding: "12px 16px", width: "100%", fontSize: 13, border: `1px solid ${colors.border}`, textAlign: "left" }}>
          🔑 Quick Codes {showCodes ? "▲" : "▼"}
        </button>
        {showCodes && (
          <div style={{ background: colors.surface, borderRadius: "0 0 10px 10px", padding: "8px 16px", borderTop: "none" }}>
            {Object.entries(KNOWN_CODES).map(([label, code]) => (
              <div key={label} style={{ display: "flex", justifyContent: "space-between", padding: "8px 0", borderBottom: `1px solid ${colors.border}`, fontSize: 14 }}>
                <span style={{ color: colors.textDim }}>{label}</span>
                <span style={{ fontFamily: "monospace", color: colors.primary, fontWeight: 700, letterSpacing: 2 }}>{code}</span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );

  // ─── ROUTE VIEW ───
  if (screen === "route" && dayData) {
    const displayStops = viewMode === "load" ? [...dayData.stops].reverse() : dayData.stops;
    const deliveredCount = dayData.stops.filter(s => s.delivered).length;

    return (
      <div style={{ background: colors.bg, minHeight: "100vh", color: colors.text, fontFamily: "'DM Sans', sans-serif", paddingBottom: 80 }}>
        <div style={{ padding: "20px 20px", borderBottom: `1px solid ${colors.border}`, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div>
            <button onClick={() => setScreen("home")} style={{ ...baseBtn, background: "transparent", color: colors.textDim, padding: 0, fontSize: 14, marginBottom: 6, minHeight: "auto" }}>← Home</button>
            <h1 style={{ fontFamily: "'DM Serif Display', serif", fontSize: 24, margin: 0, color: colors.primary }}>
              {routes.find(r => r.id === activeRouteId)?.name || "Today's Run"}
            </h1>
            <p style={{ color: colors.textDim, fontSize: 14, margin: "4px 0 0" }}>{dayData.date} · {deliveredCount}/{dayData.stops.length} delivered</p>
          </div>
          <button onClick={() => setScreen("summary")} style={{ ...baseBtn, background: colors.surface, color: colors.accent, padding: "8px 14px", fontSize: 13, border: `1px solid ${colors.border}` }}>
            Summary
          </button>
        </div>

        <div style={{ display: "flex", margin: "16px 20px", background: colors.surface, borderRadius: 12, overflow: "hidden", border: `1px solid ${colors.border}` }}>
          {[["delivery", "🚛 Delivery Order"], ["load", "📦 Load Order"]].map(([mode, label]) => (
            <button key={mode} onClick={() => setViewMode(mode)}
              style={{ ...baseBtn, flex: 1, padding: "14px", fontSize: 15, borderRadius: 0,
                background: viewMode === mode ? colors.primary : "transparent",
                color: viewMode === mode ? "#1A1612" : colors.textDim }}>
              {label}
            </button>
          ))}
        </div>
        {viewMode === "load" && (
          <p style={{ color: colors.accent, fontSize: 13, textAlign: "center", margin: "0 0 12px", fontStyle: "italic" }}>
            ↑ First item goes in the back of the van
          </p>
        )}

        <div style={{ padding: "0 14px" }}>
          {displayStops.map((stop, idx) => {
            const info = allStops[stop.stopId] || {};
            const isExpanded = expandedStop === stop.stopId;
            const total = stop.products.reduce((sum, p) => sum + (p.qty * p.rate), 0);
            const hasAdjustments = stop.products.some(p => p.originalQty > 0 && p.qty !== p.originalQty);
            const routeNote = info.routeNotes?.[activeRouteId];
            const realIdx = dayData.stops.findIndex(s => s.stopId === stop.stopId);

            return (
              <div key={stop.stopId} style={{ background: colors.surface, borderRadius: 14, marginBottom: 10, border: `1px solid ${stop.delivered ? colors.success : colors.border}`, overflow: "hidden" }}>
                <div onClick={() => setExpandedStop(isExpanded ? null : stop.stopId)}
                  style={{ padding: "18px 18px", cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 14, flex: 1, minWidth: 0 }}>
                    <span style={{ fontSize: 14, color: colors.textMuted, fontWeight: 700, minWidth: 24 }}>
                      {viewMode === "load" ? `L${idx + 1}` : `${stop.order}`}
                    </span>
                    <div style={{ minWidth: 0 }}>
                      <div style={{ fontWeight: 600, fontSize: 17, color: stop.delivered ? colors.success : colors.text, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                        {stop.delivered && "✓ "}{info.name || stop.stopId}
                      </div>
                      <div style={{ fontSize: 14, color: colors.textDim, marginTop: 3 }}>
                        {info.checkPizza && "🍕 "}{stop.returns.length > 0 && "↩️ "}{hasAdjustments && "⚠️ "}
                        {stop.products.length > 0 && `$${total.toFixed(2)}`}
                      </div>
                    </div>
                  </div>
                  <span style={{ color: colors.textMuted, fontSize: 18 }}>{isExpanded ? "▲" : "▼"}</span>
                </div>

                {isExpanded && (
                  <div style={{ borderTop: `1px solid ${colors.border}`, padding: "16px 18px" }}>
                    <div style={{ marginBottom: 16 }}>
                      <div style={{ fontSize: 15, color: colors.accent, marginBottom: 6, display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                        <span>📍 {info.address}</span>
                        <div style={{ display: "flex", gap: 6 }}>
                          <a href={`https://maps.apple.com/?q=${encodeURIComponent(info.address)}`} target="_blank" rel="noopener noreferrer"
                            onClick={e => e.stopPropagation()}
                            style={{ fontSize: 13, color: colors.accent, background: colors.surfaceLight, padding: "4px 10px", borderRadius: 6, textDecoration: "none" }}>
                            Apple ↗
                          </a>
                          <a href={`https://maps.google.com/maps?q=${encodeURIComponent(info.address)}`} target="_blank" rel="noopener noreferrer"
                            onClick={e => e.stopPropagation()}
                            style={{ fontSize: 13, color: colors.accent, background: colors.surfaceLight, padding: "4px 10px", borderRadius: 6, textDecoration: "none" }}>
                            Google ↗
                          </a>
                        </div>
                      </div>
                      {info.contact && <div style={{ fontSize: 14, color: colors.textDim, marginBottom: 6 }}>👤 {info.contact}</div>}
                      {info.hours && <div style={{ fontSize: 14, color: colors.textDim, marginBottom: 6 }}>🕐 {info.hours}</div>}
                      <div style={{ fontSize: 14, color: colors.textDim, background: colors.surfaceLight, padding: "12px 14px", borderRadius: 8, lineHeight: 1.5, marginTop: 6 }}>
                        {info.notes}
                      </div>
                      {routeNote && (
                        <div style={{ fontSize: 14, color: colors.primary, background: `${colors.primary}15`, padding: "12px 14px", borderRadius: 8, marginTop: 6, fontWeight: 600, lineHeight: 1.5 }}>
                          ⚠️ {routeNote}
                        </div>
                      )}
                    </div>

                    <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
                      <button disabled={realIdx === 0} onClick={(e) => { e.stopPropagation(); moveStop(realIdx, -1); }}
                        style={{ ...baseBtn, background: colors.surfaceLight, color: realIdx === 0 ? colors.textMuted : colors.text, padding: "8px 14px", fontSize: 13, opacity: realIdx === 0 ? 0.4 : 1 }}>▲ Up</button>
                      <button disabled={realIdx === dayData.stops.length - 1} onClick={(e) => { e.stopPropagation(); moveStop(realIdx, 1); }}
                        style={{ ...baseBtn, background: colors.surfaceLight, color: realIdx === dayData.stops.length - 1 ? colors.textMuted : colors.text, padding: "8px 14px", fontSize: 13, opacity: realIdx === dayData.stops.length - 1 ? 0.4 : 1 }}>▼ Down</button>
                      <button onClick={(e) => { e.stopPropagation(); if(confirm(`Remove ${info.name || stop.stopId} from today's route?`)) { setExpandedStop(null); setDayData(prev => ({ ...prev, stops: prev.stops.filter(s => s.stopId !== stop.stopId).map((s, i) => ({ ...s, order: i + 1 })) })); } }}
                        style={{ ...baseBtn, background: "transparent", color: colors.danger, padding: "8px 14px", fontSize: 13, marginLeft: "auto" }}>✕ Remove</button>
                    </div>

                    <div style={{ marginBottom: 16 }}>
                      <h3 style={{ fontSize: 14, color: colors.textDim, textTransform: "uppercase", letterSpacing: 0.5, margin: "0 0 10px" }}>Invoice Items</h3>
                      {stop.products.length === 0 && <p style={{ fontSize: 15, color: colors.textMuted, fontStyle: "italic" }}>No products loaded yet</p>}
                      {stop.products.map((p, pi) => {
                        const adjusted = p.originalQty > 0 && p.qty !== p.originalQty;
                        return (
                          <div key={pi} style={{ padding: "14px 0", borderBottom: `1px solid ${colors.border}` }}>
                            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
                              <button onClick={() => updateProduct(stop.stopId, pi, { delivered: !p.delivered })}
                                style={{ ...baseBtn, background: "transparent", padding: 0, fontSize: 22, color: p.delivered ? colors.success : colors.textMuted, minWidth: 32, minHeight: "auto" }}>
                                {p.delivered ? "✅" : "⬜"}
                              </button>
                              <div style={{ flex: 1 }}>
                                <div style={{ fontSize: 16, color: colors.text, fontWeight: 500 }}>{p.name}</div>
                                {adjusted && <div style={{ fontSize: 13, color: colors.danger, marginTop: 2 }}>was {p.originalQty}</div>}
                              </div>
                              <button onClick={() => { if(confirm(`Remove ${p.name}?`)) removeProduct(stop.stopId, pi); }}
                                style={{ ...baseBtn, background: "transparent", color: colors.textMuted, fontSize: 16, padding: "2px 6px", minHeight: "auto", opacity: 0.5 }}>✕</button>
                            </div>
                            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", paddingLeft: 42 }}>
                              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                                <button onClick={() => updateProduct(stop.stopId, pi, { qty: Math.max(0, p.qty - 1) })}
                                  style={{ ...baseBtn, background: colors.surfaceLight, color: colors.text, width: 40, height: 40, padding: 0, fontSize: 20, display: "flex", alignItems: "center", justifyContent: "center" }}>−</button>
                                <span style={{ fontFamily: "monospace", fontSize: 20, fontWeight: 700, minWidth: 28, textAlign: "center", color: adjusted ? colors.danger : colors.text }}>{p.qty}</span>
                                <button onClick={() => updateProduct(stop.stopId, pi, { qty: p.qty + 1 })}
                                  style={{ ...baseBtn, background: colors.surfaceLight, color: colors.text, width: 40, height: 40, padding: 0, fontSize: 20, display: "flex", alignItems: "center", justifyContent: "center" }}>+</button>
                              </div>
                              <div style={{ fontFamily: "monospace", fontSize: 16, color: colors.textDim }}>
                                ${(p.qty * p.rate).toFixed(2)}
                              </div>
                            </div>
                          </div>
                        );
                      })}
                      {stop.products.length > 0 && (
                        <div style={{ display: "flex", justifyContent: "space-between", padding: "14px 0 6px", fontWeight: 700 }}>
                          <span style={{ fontSize: 16 }}>Total</span>
                          <span style={{ fontFamily: "monospace", fontSize: 18, color: hasAdjustments ? colors.danger : colors.primary }}>
                            ${total.toFixed(2)} {hasAdjustments && "⚠️"}
                          </span>
                        </div>
                      )}
                      {showAddProduct === stop.stopId ? (
                        <AddProductForm onAdd={(p) => { addProduct(stop.stopId, p); setShowAddProduct(null); }} onCancel={() => setShowAddProduct(null)} colors={colors} baseBtn={baseBtn} />
                      ) : (
                        <button onClick={() => setShowAddProduct(stop.stopId)} style={{ ...baseBtn, background: "transparent", color: colors.textMuted, padding: "10px 0", fontSize: 14, border: "none", minHeight: "auto" }}>+ Add product</button>
                      )}
                    </div>

                    {info.checkPizza && (
                      <div style={{ marginBottom: 16, background: colors.surfaceLight, borderRadius: 10, padding: "16px" }}>
                        <label style={{ fontSize: 15, color: colors.textDim, display: "block", marginBottom: 8 }}>🍕 Pizza Crust Count</label>
                        <input type="number" inputMode="numeric" value={stop.pizzaCount} onChange={e => updateStop(stop.stopId, { pizzaCount: e.target.value })}
                          placeholder="0" style={{ background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 10, padding: "12px 14px", color: colors.text, fontSize: 24, fontFamily: "monospace", fontWeight: 700, width: 90, textAlign: "center" }} />
                      </div>
                    )}

                    <div style={{ marginBottom: 16 }}>
                      <h3 style={{ fontSize: 14, color: colors.textDim, textTransform: "uppercase", letterSpacing: 0.5, margin: "0 0 10px" }}>↩️ Bread Returns</h3>
                      {stop.returns.length === 0 && <p style={{ fontSize: 15, color: colors.textMuted, fontStyle: "italic" }}>No returns</p>}
                      {stop.returns.map(r => (
                        <div key={r.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 0", borderBottom: `1px solid ${colors.border}` }}>
                          <span style={{ fontSize: 16 }}>{r.qty} × {r.product}</span>
                          <button onClick={() => removeReturn(stop.stopId, r.id)} style={{ ...baseBtn, background: "transparent", color: colors.danger, fontSize: 20, padding: "4px 8px", minHeight: "auto" }}>×</button>
                        </div>
                      ))}
                      {showAddReturn === stop.stopId ? (
                        <AddReturnForm onAdd={(r) => { addReturn(stop.stopId, r); setShowAddReturn(null); }} onCancel={() => setShowAddReturn(null)} colors={colors} baseBtn={baseBtn} stopProducts={stop.products} />
                      ) : (
                        <button onClick={() => setShowAddReturn(stop.stopId)} style={{ ...baseBtn, background: "transparent", color: colors.textMuted, padding: "10px 0", fontSize: 14, border: "none", minHeight: "auto" }}>+ Add return</button>
                      )}
                    </div>

                    <div style={{ marginBottom: 16 }}>
                      <h3 style={{ fontSize: 14, color: colors.textDim, textTransform: "uppercase", letterSpacing: 0.5, margin: "0 0 10px" }}>📝 Notes for Today</h3>
                      <textarea value={stop.dailyNotes} onChange={e => updateStop(stop.stopId, { dailyNotes: e.target.value })}
                        placeholder="e.g., Ask Mark about invoice..."
                        style={{ background: colors.surfaceLight, border: `1px solid ${colors.border}`, borderRadius: 10, padding: "14px", color: colors.text, fontSize: 15, fontFamily: "'DM Sans', sans-serif", width: "100%", minHeight: 70, resize: "vertical", boxSizing: "border-box", lineHeight: 1.5 }} />
                    </div>

                    <button onClick={() => updateStop(stop.stopId, { delivered: !stop.delivered })}
                      style={{ ...baseBtn, width: "100%", padding: "16px", fontSize: 17,
                        background: stop.delivered ? colors.surfaceLight : colors.success,
                        color: stop.delivered ? colors.textDim : "#fff",
                        border: `1px solid ${stop.delivered ? colors.border : colors.success}` }}>
                      {stop.delivered ? "↩ Mark as Not Delivered" : "✓ Mark as Delivered"}
                    </button>
                  </div>
                )}
              </div>
            );
          })}
        </div>

        {/* Add Stop */}
        <div style={{ padding: "10px 14px 0" }}>
          {showAddStop ? (
            <div style={{ background: colors.surface, borderRadius: 14, padding: "18px", border: `1px solid ${colors.border}` }}>
              <h3 style={{ fontSize: 14, color: colors.textDim, textTransform: "uppercase", letterSpacing: 0.5, margin: "0 0 12px" }}>Add Stop to Route</h3>
              {(() => {
                const currentIds = dayData.stops.map(s => s.stopId);
                const available = Object.values(allStops).filter(s => !currentIds.includes(s.id));
                return (
                  <>
                    {available.length > 0 && (
                      <div style={{ maxHeight: 240, overflowY: "auto", marginBottom: 12 }}>
                        {available.map(s => (
                          <button key={s.id} onClick={() => {
                            const newStop = {
                              stopId: s.id, order: dayData.stops.length + 1,
                              products: (s.defaultProducts || []).map((p, j) => ({ ...p, id: `${s.id}-${j}`, originalQty: p.qty, delivered: false })),
                              pizzaCount: "", returns: [], dailyNotes: "", delivered: false,
                            };
                            setDayData(prev => ({ ...prev, stops: [...prev.stops, newStop] }));
                            setShowAddStop(false);
                          }} style={{ ...baseBtn, background: colors.surfaceLight, color: colors.text, padding: "14px 14px", width: "100%", textAlign: "left", marginBottom: 6, fontSize: 15, border: `1px solid ${colors.border}`, borderRadius: 10, display: "block" }}>
                            <div style={{ fontWeight: 600 }}>{s.name}</div>
                            <div style={{ fontSize: 13, color: colors.textDim, marginTop: 3 }}>{s.address}</div>
                          </button>
                        ))}
                      </div>
                    )}
                    <AddCustomStopForm onAdd={(ns) => {
                      const id = `custom-${Date.now()}`;
                      const stopData = { id, name: ns.name, shortName: ns.name, address: ns.address, contact: ns.contact || "", hours: "", notes: ns.notes || "", checkPizza: false, defaultProducts: [] };
                      setCustomStops(prev => ({ ...prev, [id]: stopData }));
                      const dayStop = { stopId: id, order: dayData.stops.length + 1, products: [], pizzaCount: "", returns: [], dailyNotes: "", delivered: false };
                      setDayData(prev => ({ ...prev, stops: [...prev.stops, dayStop] }));
                      setShowAddStop(false);
                    }} onCancel={() => setShowAddStop(false)} colors={colors} baseBtn={baseBtn} />
                  </>
                );
              })()}
            </div>
          ) : (
            <button onClick={() => setShowAddStop(true)}
              style={{ ...baseBtn, background: colors.surface, color: colors.textDim, padding: "16px", width: "100%", fontSize: 15, border: `1px dashed ${colors.border}`, borderRadius: 14 }}>
              + Add Stop to Route
            </button>
          )}
        </div>

        {/* Standard Ops */}
        <div style={{ padding: "16px 14px" }}>
          <div style={{ background: colors.surface, borderRadius: 14, padding: "16px 18px", border: `1px solid ${colors.border}` }}>
            <h3 style={{ fontSize: 14, color: colors.textDim, textTransform: "uppercase", letterSpacing: 0.5, margin: "0 0 10px" }}>⚙️ Standard Ops</h3>
            {standardOps.map((op, i) => (
              <div key={op.id} onClick={() => setStandardOps(prev => prev.map((o, j) => j === i ? { ...o, checked: !o.checked } : o))}
                style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 0", cursor: "pointer", borderBottom: i < standardOps.length - 1 ? `1px solid ${colors.border}` : "none" }}>
                <span style={{ fontSize: 22 }}>{op.checked ? "✅" : "⬜"}</span>
                <span style={{ fontSize: 15, color: op.checked ? colors.textMuted : colors.text, textDecoration: op.checked ? "line-through" : "none" }}>{op.text}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    );
  }

  // ─── SUMMARY SCREEN ───
  if (screen === "summary" && dayData) {
    const summary = generateSummary();
    return (
      <div style={{ background: colors.bg, minHeight: "100vh", color: colors.text, fontFamily: "'DM Sans', sans-serif", padding: "0 0 40px" }}>
        <div style={{ padding: "20px 20px", borderBottom: `1px solid ${colors.border}`, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div>
            <button onClick={() => setScreen("route")} style={{ ...baseBtn, background: "transparent", color: colors.textDim, padding: 0, fontSize: 14, marginBottom: 6, minHeight: "auto" }}>← Back to Route</button>
            <h1 style={{ fontFamily: "'DM Serif Display', serif", fontSize: 24, margin: 0, color: colors.primary }}>Day Summary</h1>
          </div>
          <div style={{ display: "flex", gap: 6 }}>
            <button onClick={() => { navigator.clipboard?.writeText(summary); setTxtCopied(true); setTimeout(() => setTxtCopied(false), 2000); }}
              style={{ ...baseBtn, background: colors.surface, color: colors.text, padding: "10px 14px", fontSize: 13, border: `1px solid ${colors.border}` }}>
              {txtCopied ? "✓ Copied!" : "📋 Copy"}
            </button>
            <button onClick={downloadXLSX}
              style={{ ...baseBtn, background: colors.primary, color: "#1A1612", padding: "10px 14px", fontSize: 13 }}>
              {csvCopied ? "✓ Done!" : "📊 Excel"}
            </button>
          </div>
        </div>
        <pre style={{ padding: "20px", fontSize: 14, lineHeight: 1.7, whiteSpace: "pre-wrap", wordBreak: "break-word", color: colors.text, fontFamily: "'DM Sans', monospace" }}>
          {summary}
        </pre>
        <div style={{ padding: "0 20px" }}>
          <button onClick={() => { if(confirm("End today's run and clear all data?")) { setDayData(null); setScreen("home"); } }}
            style={{ ...baseBtn, width: "100%", padding: "16px", background: colors.dangerDim, color: colors.text, fontSize: 16, border: `1px solid ${colors.danger}` }}>
            End Day & Clear
          </button>
        </div>
      </div>
    );
  }

  return null;
}

// ─── SUB-COMPONENTS ───
function AddProductForm({ onAdd, onCancel, colors, baseBtn }) {
  const [selected, setSelected] = useState("");
  const [rate, setRate] = useState("");
  const [qty, setQty] = useState("1");
  const [customMode, setCustomMode] = useState(false);
  const [customName, setCustomName] = useState("");

  function handleSelect(val) {
    if (val === "__custom__") {
      setCustomMode(true);
      setSelected(val);
      setRate("");
    } else {
      setSelected(val);
      setCustomMode(false);
      const product = ALL_PRODUCTS.find(p => p.name === val);
      if (product) setRate(String(product.rate));
    }
  }

  function handleAdd() {
    const name = customMode ? customName : selected;
    if (name && rate && qty) onAdd({ name, rate: parseFloat(rate), qty: parseInt(qty) });
  }

  return (
    <div style={{ background: colors.surfaceLight, borderRadius: 8, padding: 12, marginTop: 8 }}>
      <select value={selected} onChange={e => handleSelect(e.target.value)}
        style={{ background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 6, padding: "10px 10px", color: selected ? colors.text : colors.textMuted, fontSize: 14, width: "100%", marginBottom: 8, boxSizing: "border-box" }}>
        <option value="" disabled>Select product...</option>
        {ALL_PRODUCTS.map(p => (
          <option key={p.name} value={p.name}>{p.name} — ${p.rate.toFixed(2)}</option>
        ))}
        <option value="__custom__">＋ Custom product...</option>
      </select>
      {customMode && (
        <div style={{ display: "flex", gap: 6, marginBottom: 8 }}>
          <input value={customName} onChange={e => setCustomName(e.target.value)} placeholder="Product name"
            style={{ background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 6, padding: "8px 10px", color: colors.text, fontSize: 14, flex: 1 }} />
          <input type="number" inputMode="decimal" value={rate} onChange={e => setRate(e.target.value)} placeholder="Price"
            style={{ background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 6, padding: "8px 10px", color: colors.text, fontSize: 14, width: 70 }} />
        </div>
      )}
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
        <span style={{ fontSize: 13, color: colors.textDim }}>Qty:</span>
        <button onClick={() => setQty(String(Math.max(1, parseInt(qty || "1") - 1)))}
          style={{ ...baseBtn, background: colors.surface, color: colors.text, width: 36, height: 36, padding: 0, fontSize: 18, display: "flex", alignItems: "center", justifyContent: "center" }}>−</button>
        <span style={{ fontFamily: "monospace", fontSize: 20, fontWeight: 700, minWidth: 24, textAlign: "center", color: colors.text }}>{qty}</span>
        <button onClick={() => setQty(String(parseInt(qty || "1") + 1))}
          style={{ ...baseBtn, background: colors.surface, color: colors.text, width: 36, height: 36, padding: 0, fontSize: 18, display: "flex", alignItems: "center", justifyContent: "center" }}>+</button>
        {selected && !customMode && <span style={{ fontSize: 13, color: colors.textDim, fontFamily: "monospace" }}>${(parseFloat(rate || 0) * parseInt(qty || 0)).toFixed(2)}</span>}
      </div>
      <div style={{ display: "flex", gap: 6 }}>
        <button onClick={handleAdd}
          style={{ ...baseBtn, background: colors.primary, color: "#1A1612", padding: "10px 14px", fontSize: 13, flex: 1 }}>Add Product</button>
        <button onClick={onCancel} style={{ ...baseBtn, background: colors.surface, color: colors.textDim, padding: "10px 14px", fontSize: 13 }}>Cancel</button>
      </div>
    </div>
  );
}

function AddReturnForm({ onAdd, onCancel, colors, baseBtn, stopProducts }) {
  const productNames = [...new Set([
    ...(stopProducts || []).map(p => p.name),
    ...ALL_PRODUCTS.map(p => p.name),
  ])].sort();
  const [product, setProduct] = useState("");
  const [customName, setCustomName] = useState("");
  const [qty, setQty] = useState("1");
  const isCustom = product === "__custom__";
  return (
    <div style={{ background: colors.surfaceLight, borderRadius: 8, padding: 12, marginTop: 8 }}>
      <select value={product} onChange={e => setProduct(e.target.value)}
        style={{ background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 6, padding: "10px 10px", color: product ? colors.text : colors.textMuted, fontSize: 14, width: "100%", marginBottom: 8, boxSizing: "border-box" }}>
        <option value="" disabled>Select product...</option>
        {productNames.map(name => (
          <option key={name} value={name}>{name}</option>
        ))}
        <option value="__custom__">＋ Other product...</option>
      </select>
      {isCustom && (
        <input value={customName} onChange={e => setCustomName(e.target.value)} placeholder="Product name"
          style={{ background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 6, padding: "10px 10px", color: colors.text, fontSize: 14, width: "100%", marginBottom: 8, boxSizing: "border-box" }} />
      )}
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
        <span style={{ fontSize: 13, color: colors.textDim }}>Qty:</span>
        <button onClick={() => setQty(String(Math.max(1, parseInt(qty || "1") - 1)))}
          style={{ ...baseBtn, background: colors.surface, color: colors.text, width: 36, height: 36, padding: 0, fontSize: 18, display: "flex", alignItems: "center", justifyContent: "center" }}>−</button>
        <span style={{ fontFamily: "monospace", fontSize: 20, fontWeight: 700, minWidth: 24, textAlign: "center", color: colors.text }}>{qty}</span>
        <button onClick={() => setQty(String(parseInt(qty || "1") + 1))}
          style={{ ...baseBtn, background: colors.surface, color: colors.text, width: 36, height: 36, padding: 0, fontSize: 18, display: "flex", alignItems: "center", justifyContent: "center" }}>+</button>
      </div>
      <div style={{ display: "flex", gap: 6 }}>
        <button onClick={() => { const name = isCustom ? customName : product; if (name && qty) onAdd({ product: name, qty: parseInt(qty) }); }}
          style={{ ...baseBtn, background: colors.primary, color: "#1A1612", padding: "10px 14px", fontSize: 13, flex: 1 }}>Add Return</button>
        <button onClick={onCancel} style={{ ...baseBtn, background: colors.surface, color: colors.textDim, padding: "10px 14px", fontSize: 13 }}>Cancel</button>
      </div>
    </div>
  );
}

function AddCustomStopForm({ onAdd, onCancel, colors, baseBtn }) {
  const [name, setName] = useState("");
  const [address, setAddress] = useState("");
  const [contact, setContact] = useState("");
  const [notes, setNotes] = useState("");
  const [showForm, setShowForm] = useState(false);
  if (!showForm) return (
    <div style={{ display: "flex", gap: 6 }}>
      <button onClick={() => setShowForm(true)} style={{ ...baseBtn, background: colors.primaryDim, color: colors.text, padding: "10px 14px", fontSize: 13, flex: 1 }}>+ New Custom Stop</button>
      <button onClick={onCancel} style={{ ...baseBtn, background: colors.surfaceLight, color: colors.textDim, padding: "10px 14px", fontSize: 13 }}>Cancel</button>
    </div>
  );
  return (
    <div style={{ borderTop: `1px solid ${colors.border}`, paddingTop: 10 }}>
      <div style={{ fontSize: 12, color: colors.textDim, marginBottom: 6, fontWeight: 600 }}>New Custom Stop</div>
      <input value={name} onChange={e => setName(e.target.value)} placeholder="Stop name *"
        style={{ background: colors.surfaceLight, border: `1px solid ${colors.border}`, borderRadius: 6, padding: "8px 10px", color: colors.text, fontSize: 14, width: "100%", marginBottom: 6, boxSizing: "border-box" }} />
      <input value={address} onChange={e => setAddress(e.target.value)} placeholder="Address *"
        style={{ background: colors.surfaceLight, border: `1px solid ${colors.border}`, borderRadius: 6, padding: "8px 10px", color: colors.text, fontSize: 14, width: "100%", marginBottom: 6, boxSizing: "border-box" }} />
      <input value={contact} onChange={e => setContact(e.target.value)} placeholder="Contact (optional)"
        style={{ background: colors.surfaceLight, border: `1px solid ${colors.border}`, borderRadius: 6, padding: "8px 10px", color: colors.text, fontSize: 14, width: "100%", marginBottom: 6, boxSizing: "border-box" }} />
      <input value={notes} onChange={e => setNotes(e.target.value)} placeholder="Delivery notes (optional)"
        style={{ background: colors.surfaceLight, border: `1px solid ${colors.border}`, borderRadius: 6, padding: "8px 10px", color: colors.text, fontSize: 14, width: "100%", marginBottom: 8, boxSizing: "border-box" }} />
      <div style={{ display: "flex", gap: 6 }}>
        <button onClick={() => { if (name && address) onAdd({ name, address, contact, notes }); }}
          style={{ ...baseBtn, background: colors.primary, color: "#1A1612", padding: "10px 14px", fontSize: 13, flex: 1 }}>Add Stop</button>
        <button onClick={onCancel} style={{ ...baseBtn, background: colors.surfaceLight, color: colors.textDim, padding: "10px 14px", fontSize: 13 }}>Cancel</button>
      </div>
    </div>
  );
}

// ─── RENDER ───
ReactDOM.render(<BonteDelivery />, document.getElementById("root"));
  </script>
</body>
</html>
